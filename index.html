<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0;padding:0;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','MS Gothic',monospace;}
html,body{width:100%;height:100%;background:#090d16;color:#101820;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;}
button{touch-action:manipulation;}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%;}
*{-webkit-tap-highlight-color:transparent;}
.gbc-shell{width:100%;max-width:400px;background:#1e293b;border:2px solid #475569;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,0.75);}
.top-bar{height:36px;background:#0f172a;border-bottom:2px solid #334155;display:flex;justify-content:space-between;align-items:center;padding:0 6px;color:#f8fafc;}
.loc-info{display:flex;flex-direction:column;overflow:hidden;max-width:42%;}
.loc-name{font-size:11px;font-weight:bold;color:#fde047;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.loc-sub{font-size:9px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-btns{display:flex;gap:3px;}
.tbtn{background:#1e293b;color:#f8fafc;border:1px solid #94a3b8;border-radius:4px;padding:3px 5px;font-size:10px;font-weight:bold;cursor:pointer;}
.tbtn:active{background:#475569;}
.tbtn:disabled{opacity:.35;}
.screen-wrap{position:relative;width:100%;background:#d8f0c8;display:flex;flex-direction:column;}
canvas#gameCanvas{display:block;width:100%;height:auto;aspect-ratio:256/160;background:#f8f8f0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
.pk-win{height:112px;background:#f8f8f0;color:#101820;border-top:3px solid #101820;box-shadow:inset 0 0 0 2px #f8f8f0,inset 0 0 0 4px #101820;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;position:relative;}
#pane-msg{width:100%;height:100%;font-size:12px;font-weight:bold;line-height:1.45;white-space:pre-wrap;display:flex;align-items:flex-start;padding:2px 4px;cursor:pointer;}
#msg-caret{position:absolute;right:10px;bottom:6px;color:#e82818;font-size:11px;animation:blink .55s infinite alternate;}
@keyframes blink{from{opacity:1}to{opacity:.15}}
#pane-cmd{width:100%;height:100%;display:flex;gap:6px;align-items:stretch;}
.cmd-left{width:37%;border-right:2px solid #101820;padding:4px;font-size:11px;font-weight:bold;display:flex;flex-direction:column;justify-content:space-between;white-space:pre-wrap;}
.grid2x2{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;}
.pbtn{background:#fff;color:#101820;border:2px solid #101820;border-radius:4px;font-size:11px;font-weight:bold;padding:2px 6px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:2px;min-width:0;}
.pbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbtn.sel,.pbtn:active{background:#fef08a;border-color:#e82818;}
.pbtn:disabled{opacity:.35;cursor:not-allowed;}
#pane-moves{width:100%;height:100%;display:flex;flex-direction:column;gap:3px;}
.mv-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:bold;}
.mv-ret{background:#101820;color:#fff;border:none;border-radius:3px;padding:2px 7px;font-size:9px;font-weight:bold;cursor:pointer;}
.modal-bg{position:absolute;inset:0;background:rgba(9,13,22,0.86);z-index:30;display:flex;justify-content:center;align-items:center;padding:8px;}
.modal-bg.title{background:rgba(9,13,22,0.25);align-items:flex-end;}
.modal-box{width:100%;max-width:340px;max-height:100%;background:#f8f8f0;color:#101820;border:3px solid #101820;box-shadow:inset 0 0 0 2px #f8f8f0,inset 0 0 0 4px #101820;border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;border-bottom:2px solid #101820;padding-bottom:3px;}
#m-desc{font-size:10px;line-height:1.4;white-space:pre-wrap;}
.modal-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;max-height:none;min-height:0;flex:0 1 auto;}
.mbtn{background:#fff;color:#101820;border:2px solid #101820;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:bold;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;min-height:32px;}
.mbtn:active{background:#fef08a;}
.mbtn:disabled{opacity:.4;cursor:not-allowed;}
.mbtn img{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;margin-right:4px;}
.mbtn .sub{font-size:9px;color:#475569;text-align:right;flex-shrink:0;}
.code-in{width:100%;font-size:10px;padding:4px;border:2px solid #101820;border-radius:4px;background:#fff;color:#101820;user-select:text;-webkit-user-select:text;}
.tb{display:inline-block;color:#fff;border-radius:3px;padding:0 4px;font-size:9px;margin-left:3px;line-height:14px;}
.hpb{display:inline-block;width:64px;height:6px;background:#687078;border:1px solid #101820;vertical-align:middle;position:relative;}
.hpb i{position:absolute;left:0;top:0;bottom:0;}
.ctrl-bar{height:108px;background:linear-gradient(180deg,#1e293b,#0f172a);display:flex;justify-content:space-between;align-items:center;padding:4px 18px 6px 18px;container-type:size;}
:root.gs .ctrl-bar{padding-left:48px;} /* Google Sites 埋め込み時の ⓘ 回避 */
.dpad{width:96px;height:96px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);touch-action:none;}
.dp{background:#334155;color:#e2e8f0;border:2px solid #64748b;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #020617;touch-action:none;}
.dp:active,.dp.on{background:#64748b;transform:translateY(2px);box-shadow:0 1px 0 #020617;}
.dp-up{grid-column:2;grid-row:1;border-radius:6px 6px 0 0;} .dp-down{grid-column:2;grid-row:3;border-radius:0 0 6px 6px;}
.dp-left{grid-column:1;grid-row:2;border-radius:6px 0 0 6px;} .dp-right{grid-column:3;grid-row:2;border-radius:0 6px 6px 0;}
.dp-c{grid-column:2;grid-row:2;background:#334155;}
.money{color:#fde047;font-size:10px;font-weight:bold;align-self:center;margin-right:3px;white-space:nowrap;}
.mbtn.sel{background:#fef08a;border-color:#e82818;box-shadow:inset 4px 0 0 #e82818;}
.mbtn .dim{color:#94a3b8;}
.joy-ring{width:84px;height:84px;background:#090d16;border:3px solid #475569;border-radius:50%;position:relative;touch-action:none;box-shadow:inset 0 4px 8px #000;}
.joy-knob{width:34px;height:34px;background:radial-gradient(circle at 35% 35%,#94a3b8,#334155);border:2px solid #e2e8f0;border-radius:50%;position:absolute;top:22px;left:22px;pointer-events:none;}
.ab-wrap{position:relative;width:112px;height:84px;}
.ab{position:absolute;width:46px;height:46px;border-radius:50%;color:#fff;font-weight:bold;font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 3px 0 #020617;cursor:pointer;}
.ab:active{transform:translateY(2px);box-shadow:0 1px 0 #020617;}
.btn-a{right:0;top:2px;background:#e11d48;border:2px solid #fda4af;}
.btn-b{left:0;bottom:2px;background:#475569;border:2px solid #cbd5e1;}
.hide{display:none!important;}
.ab{touch-action:none;}
/* === スマホ・タブレット（縦持ち）：画面いっぱいに表示し、あまった高さを操作パネルに使う === */
@media (orientation:portrait) and (pointer:coarse), (orientation:portrait) and (max-width:699px){

  .screen-wrap{flex-shrink:0;}

  #pane-msg{font-size:clamp(14px,3.4vw,24px);} .cmd-left{font-size:clamp(13px,3vw,21px);} .pbtn{font-size:clamp(13px,3vw,21px);}
  .modal-box{max-width:min(92%,560px);}
  .modal-hdr{font-size:clamp(14px,3.2vw,22px);} #m-desc{font-size:clamp(12px,2.6vw,18px);} .mbtn{font-size:clamp(13px,3vw,21px);min-height:clamp(40px,8vw,60px);} .mbtn .sub{font-size:clamp(10px,2.2vw,15px);}

  .ctrl-bar{flex:1;height:auto;min-height:120px;padding:8px 20px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-around;}

  .dpad{width:min(40vw,150px);height:min(40vw,150px);width:min(40vw,84cqh,240px);height:min(40vw,84cqh,240px);}
  .dp{font-size:20px;}
  .ab-wrap{width:min(40vw,150px);height:min(32vw,120px);width:min(40vw,84cqh,240px);height:min(32vw,68cqh,190px);}
  .ab{width:min(18.5vw,70px);height:min(18.5vw,70px);width:min(18.5vw,40cqh,108px);height:min(18.5vw,40cqh,108px);font-size:22px;}
  .ab span{display:none;}
}
/* === スマホ（横持ち）：左に十字キー、中央に画面、右に A・B === */
@media (orientation:landscape) and (pointer:coarse) and (max-height:560px){
  html,body{height:100vh;height:100dvh;}
  .gbc-shell{width:100vw;max-width:none;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto 1fr;}
  .top-bar{grid-column:1/4;height:30px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));}
  .loc-info{flex-direction:row;gap:8px;align-items:baseline;max-width:60%;}
  .screen-wrap{grid-column:2;grid-row:2;width:calc((100vh - 114px) * 1.6);width:calc((100dvh - 114px) * 1.6);align-self:start;}
  .pk-win{height:84px;padding:4px 8px;}
  .modal-list{max-height:calc(100vh - 200px);}
  .ctrl-bar{display:contents;}
  .dpad{grid-column:1;grid-row:2;align-self:center;justify-self:center;width:min(22vw,150px,calc((100vw - (100vh - 114px) * 1.6) / 2 - 14px));height:min(22vw,150px,calc((100vw - (100vh - 114px) * 1.6) / 2 - 14px));}
  .dp{font-size:18px;}
  .ab-wrap{grid-column:3;grid-row:2;align-self:center;justify-self:center;width:min(22vw,150px,calc((100vw - (100vh - 114px) * 1.6) / 2 - 14px));height:auto;aspect-ratio:1.15;}
  .ab{width:47%;height:auto;aspect-ratio:1;font-size:18px;} .ab span{display:none;}
  .kb-hint{display:none!important;}
}
.kb-hint{display:none;color:#94a3b8;font-size:11px;line-height:1.6;text-align:center;}
.kb-hint b{color:#f8fafc;}
/* === PC表示：画面の高さに合わせて大きく表示 === */
@media (min-width:700px) and (hover:hover) and (pointer:fine){
  html,body{align-items:center;}
  .gbc-shell{max-width:min(96vw, calc((100vh - 310px) * 1.6));min-width:400px;border-width:3px;border-radius:14px;}
  .top-bar{height:44px;padding:0 10px;}
  .loc-name{font-size:14px;} .loc-sub{font-size:11px;}
  .tbtn{font-size:13px;padding:5px 9px;}
  .pk-win{height:132px;padding:8px 12px;}
  #pane-msg{font-size:17px;line-height:1.5;}
  #msg-caret{font-size:14px;}
  .cmd-left{font-size:15px;}
  .pbtn{font-size:15px;padding:4px 10px;}
  .pbtn span[style]{font-size:12px!important;}
  .mv-top{font-size:13px;} .mv-ret{font-size:12px;padding:3px 10px;}
  .modal-box{max-width:520px;padding:12px;gap:8px;}
  .modal-hdr{font-size:16px;} #m-desc{font-size:13px;}
  .modal-list{max-height:none;}
  .mbtn{font-size:15px;min-height:42px;padding:6px 12px;}
  .mbtn .sub{font-size:12px;}
  .mbtn img{width:40px;height:40px;}
  .code-in{font-size:13px;padding:6px;}
  .tb{font-size:11px;line-height:16px;}
  .hpb{width:90px;height:8px;}
  .ctrl-bar{height:110px;padding:4px 28px 6px 56px;}
  .kb-hint{display:block;}
  .dpad{width:104px;height:104px;} .dp{font-size:16px;}
  .money{font-size:13px;}
}

<script type="module">
// クラウド保存（実行環境が Firebase 設定を注入している場合のみ有効。無ければ自動的に無効化）
let db = null, auth = null, appId = 'pk-hz-rpg', fs = null;
window.cloudReady = false;
try {
  if (typeof __firebase_config !== 'undefined') {
    const [{ initializeApp }, A, F] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
    ]);
    const app = initializeApp(JSON.parse(__firebase_config));
    db = F.getFirestore(app); auth = A.getAuth(app); fs = {A, F};
    appId = typeof __app_id !== 'undefined' ? __app_id : 'pk-hz-rpg';
    window.cloudReady = true;
  }
} catch (e) { console.warn("Cloud save disabled"); }
window.dispatchEvent(new Event('cloud-ready'));
async function uid() {
  if (!auth) return null;
  if (auth.currentUser) return auth.currentUser.uid;
  try {
    if (typeof __initial_auth_token !== 'undefined') await fs.A.signInWithCustomToken(auth, __initial_auth_token);
    else await fs.A.signInAnonymously(auth);
    return auth.currentUser.uid;
  } catch (e) { return null; }
}
window.safeSaveCloud = async (data) => {
  try { const u = await uid(); if (!u) return false;
    await fs.F.setDoc(fs.F.doc(db, 'artifacts', appId, 'users', u, 'saveData'), { raw: data }); return true;
  } catch (e) { return false; }
};
window.safeLoadCloud = async () => {
  try { const u = await uid(); if (!u) return null;
    const s = await fs.F.getDoc(fs.F.doc(db, 'artifacts', appId, 'users', u, 'saveData'));
    if (s.exists()) return s.data().raw;
  } catch (e) {}
  return null;
};
</script>

function buildSprite(mat, scale, flip = false) {
  const c = document.createElement('canvas');
  c.width = 16 * scale; c.height = 16 * scale;
  if (!mat) return c;
  const cx = c.getContext('2d');
  for (let r = 0; r < 16; r++) {
    const row = mat[r] || '';
    for (let col = 0; col < 16; col++) {
      const ch = row[col];
      if (ch && PAL[ch]) { cx.fillStyle = PAL[ch]; cx.fillRect((flip ? 15 - col : col) * scale, r * scale, scale, scale); }
    }
  }
  return c;
}

function calcDmg(att, def, mv, isPl) {
  const ef = eff(mv.t, def.t), stab = mv.t === att.t ? 1.25 : 1;
  const crit = Math.random() < 1 / 16 ? 1.5 : 1, rnd = 0.85 + Math.random() * 0.15;
  const dmg = Math.max(1, Math.floor((att.a * mv.p) / (def.d * 7) * ef * stab * crit * rnd * (isPl ? 1 : 0.9)));
  return {dmg, ef, crit:crit > 1};
}
function enemyChoose(en, pm) {

    en.m.forEach(k => { const mv = MOVES[k]; const v = mv.p * eff(mv.t, pm.t) * (mv.t === en.t ? 1.25 : 1) * mv.ac / 100; if (v > bv) { bv = v; best = k; } });
    return best;
  }

}
function doAttack(att, def, key, isPl, next) {

  buzz(r.ef > 1 ? 40 : 20);

// === 更新 ===
function update() {
  tick++;
  updMsg();
  if (navHeld) { navT++; if (navT > 24 && navT % 7 === 0 && !navMove(navHeld)) navHeld = null; }
  if (st === 'MAP') {
    const anyKey = KEYS.up || KEYS.down || KEYS.left || KEYS.right;
    if (!anyKey) bumpKey = null;
    if (!isMoving && !msgCb && !modalOpen()) {
      if (KEYS.up) tryStep('up'); else if (KEYS.down) tryStep('down');
      else if (KEYS.left) tryStep('left'); else if (KEYS.right) tryStep('right');
    }
    if (isMoving) {
      moveProg = Math.min(1, moveProg + (hop ? 1 / 15 : 1 / 9));
      rx = moveFrom.x + (moveTarget.x - moveFrom.x) * moveProg;
      ry = moveFrom.y + (moveTarget.y - moveFrom.y) * moveProg;
      if (moveProg >= 1) {
        pl.x = moveTarget.x; pl.y = moveTarget.y; rx = pl.x; ry = pl.y; isMoving = false; hop = false;
        arrive(moveTarget.t);
      }
    }
  } else if (st === 'TRANS' && trans) {
    trans.t++;
    if (trans.t >= 56) { const f = trans.onDone; trans = null; f(); }
  } else if (st === 'BATTLE' && bat) {
    const fx = bat.fx;
    ['intro', 'eHit', 'pHit', 'eLunge', 'pLunge', 'eIn', 'pIn'].forEach(k => { if (fx[k] > 0) fx[k]--; });
    if (fx.eFaint > 0 && fx.eFaint < 20) fx.eFaint++;
    if (fx.pFaint > 0 && fx.pFaint < 20) fx.pFaint++;
    bat.dE += (bat.e.hp - bat.dE) * 0.12; if (Math.abs(bat.e.hp - bat.dE) < 0.3) bat.dE = bat.e.hp;
    const p = P(); bat.dP += (p.hp - bat.dP) * 0.12; if (Math.abs(p.hp - bat.dP) < 0.3) bat.dP = p.hp;
    if (bat.ball) {
      bat.ball.t++;
      const b = bat.ball, shakeT = 36 + b.shakes * 28;
      if (b.t > 36 && b.t <= shakeT && (b.t - 36) % 28 === 1) sfx(300, 0.05);
      if (b.t === shakeT + 20 && b.done) { const d = b.done; b.done = null; d(); }
    }
  } else if (st === 'EVO' && evoSt) {
    evoSt.t++;
    if (evoSt.t === 170) evoSt.onApply();
    if (evoSt.t === 210) evoSt.onDone();
  }
}

  }

function drawMap() {
  const m = MAPS[mapId], W = mapW(m), H = mapH(m);

  camOy = Math.round(Math.max(0, Math.min(H - 10, ry - 4.5)) * 16);
  const c0 = Math.floor(camOx / 16), r0 = Math.floor(camOy / 16);
  for (let r = r0; r <= r0 + 10 && r < H; r++) for (let c = c0; c <= c0 + 16 && c < W; c++) drawTile(m.g[r][c], c * 16 - camOx, r * 16 - camOy, m, c, r);
  (m.items || []).forEach(it => {
    if (pl.def[it.id]) return;
    const x = it.x * 16 - camOx + 8, y = it.y * 16 - camOy + 9;
    ctx.fillStyle = 'rgba(16,24,32,.25)'; ctx.fillRect(x - 5, y + 4, 10, 2);
    ctx.fillStyle = '#101820'; ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.fill();

  });
  (m.npcs || []).forEach(n => {
    if (!npcVisible(n)) return;
    const x = n.x * 16 - camOx, y = n.y * 16 - camOy;
    if (x < -40 || x > 272 || y < -20 || y > 176) return;

      const bx = x + k * 16; ctx.fillStyle = '#101820'; ctx.fillRect(bx + 1, y + 6, 14, 7);
      ctx.fillStyle = '#f8e030'; for (let q = 0; q < 3; q++) ctx.fillRect(bx + 2 + q * 5, y + 7, 3, 5);

function drawTransOverlay() {

    if (trans.wild) {
      const x = Math.round(rx * 16) - camOx, y = Math.round(ry * 16) - camOy;

  const k = Math.min(1, (t - 18) / 32);

  for (let i = 0; i < 10; i++) {

function drawHpBar(x, y, w, cur, max) {

function drawSprite(key, x, y, faint, hit) {
  if (hit > 0 && (hit >> 2) % 2 === 0) return;
  const img = SPR[key]; if (!img) return;
  if (faint > 0) {
    const off = faint * 4; if (off >= 64) return;
    ctx.drawImage(img, 0, 0, 64, 64 - off, x, y + off, 64, 64 - off);
  } else ctx.drawImage(img, x, y);
}
function drawBattle() {
  ctx.fillStyle = '#f8f8f0'; ctx.fillRect(0, 0, 256, 160);
  ctx.fillStyle = (THEME[bat.theme] || THEME.grass).bg; ctx.fillRect(0, 0, 256, 80);
  const e = bat.e, p = P(), fx = bat.fx;

  ctx.beginPath(); ctx.ellipse(208, 68, 44, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(48, 150, 46, 9, 0, 0, Math.PI * 2); ctx.fill();

  let ex = 176 - fx.intro * 6 + fx.eIn * 3 - lungeOf(fx.eLunge) + (fx.eHit > 12 ? Math.sin(fx.eHit * 2) * 3 : 0);

  }

  drawSprite('m_b_' + p.id, Math.round(px), 88, fx.pFaint, fx.pHit);
  // 敵ステータス

  // 味方ステータス

  txt('HP', 112, 121, '#e88818', 8); drawHpBar(128, 115, 110, bat.dP, p.mhp);
  txt(`${Math.ceil(bat.dP)}/${p.mhp}`, 176, 135);
  ctx.fillStyle = '#101820'; ctx.fillRect(106, 142, 142, 2); ctx.fillRect(246, 100, 2, 44);

function drawCapsule(x, y, ang) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = '#101820'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e82818'; ctx.beginPath(); ctx.arc(0, 0, 6.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#f8f8f0'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#101820'; ctx.fillRect(-7, -1, 14, 2);
  ctx.fillStyle = '#f8f8f0'; ctx.fillRect(-2, -2, 4, 4);

function drawEvo() {
  const t = evoSt.t;
  ctx.fillStyle = '#101820'; ctx.fillRect(0, 0, 256, 160);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + t * 0.02;
    ctx.strokeStyle = i % 2 ? '#1840a8' : '#3090f8'; ctx.lineWidth = 6;

  }
  const period = Math.max(3, 24 - Math.floor(t / 8));
  const showTo = t >= 170 || (t > 30 && t < 170 && Math.floor(t / period) % 2 === 1);
  const id = showTo ? evoSt.to : evoSt.from;
  ctx.drawImage(SPR['m_f_' + id], 96, 40);
  if (t >= 160 && t < 185) { ctx.fillStyle = `rgba(248,248,240,${1 - Math.abs(t - 172) / 13})`; ctx.fillRect(0, 0, 256, 160); }

function draw() {
  if (st === 'TITLE') drawTitle();
  else if (st === 'BATTLE' && bat) drawBattle();
  else if (st === 'EVO' && evoSt) drawEvo();
  else { drawMap(); if (st === 'TRANS' && trans) drawTransOverlay(); }
}
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(200, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 8) { update(); acc -= 1000 / 60; n++; }
  draw();
  requestAnimationFrame(frame);
}

// === 入力 ===
function handleA() {
  startAudio();
  if (typing()) { msgPos = msgFull.length; $('msg-txt').textContent = msgFull; return; }
  if (msgCb) { const c = msgCb; msgCb = null; sfx(1000, 0.03); c(); return; }
  if (navConfirm()) return;
  if (modalOpen()) return;
  if (st === 'MAP') interactFacing();
}
function handleB() {
  startAudio();
  if (modalOpen()) {
    if (st !== 'TITLE' && !$('m-close').classList.contains('hide')) { closeModal(); sfx(600, 0.03); return; }
    const back = [...document.querySelectorAll('#m-list .mbtn')].find(b => /^[↩✕]/.test(b.textContent) && !b.disabled);
    if (back) back.click();
    return;
  }
  if (st === 'BATTLE' && bat && !bat.busy && !$('pane-moves').classList.contains('hide')) { openCmdPane(); return; }
  if (st === 'MAP' && !typing() && !msgCb && !isMoving) openMenu();
}
function dirPress(dir) { startAudio(); if (navMove(dir)) return true; return false; }
function warpMenu() {
  if (st !== 'MAP' || msgCb || isMoving) return;
  const go = (m) => () => { const f = townFront(m); closeModal(); warpTo(f.m, f.x, f.y); pl.dir = 'down'; showMsg(`${MAPS[m].n}へ 移動した！`); };
  const items = WARP_TOWNS.filter(([m]) => pl.vis[m]).map(([m, ic]) => ({l:`${ic} ${MAPS[m].n}`, s:m === mapId ? '現在地' : '', fn:go(m)}));
  items.push({l:'↩ メニューへ', s:'', fn:openMenu});
  showModal('🗺️ エリア移動', '一度 訪れた 町へ すぐに 移動できます', items);
}

function init() {
  initSprites();
  tap('m-close', closeModal);
  tap('pane-msg', handleA);
  tap(cvs, () => { if (typing() || msgCb) handleA(); });
  tap('c0', openMovesPane);
  tap('c1', () => { if (bat && !bat.busy) openPartyModal(false); });
  tap('c2', openBagModal);
  tap('c3', tryRun);
  tap('mv-back', () => { if (bat && !bat.busy) openCmdPane(); });
  [0, 1, 2, 3].forEach(i => tap('m' + i, () => playerTurn(i)));
  tap('btn-menu', () => { if (modalOpen() && st === 'MAP') closeModal(); else openMenu(); });
  tap('btn-snd', () => { muted = !muted; $('btn-snd').textContent = muted ? '🔇音' : '🔊音'; });
  tap('btn-a', handleA);
  tap('btn-b', handleB);

  // 十字キー（画面）：押したまま 指を すべらせて 方向を 変えられる

    if (dir === dpDir) return;

    if (dpDir) KEYS[dpDir] = false;
    dpDir = dir; navHeld = null;
    if (!dir) return;

    if (dirPress(dir)) { navHeld = dir; navT = 0; } else { clearKeys(); KEYS[dir] = true; }
  };
  const dpFrom = (e) => {
    const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) return dpDir;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  };
  dpad.addEventListener('pointerdown', e => { e.preventDefault(); dpId = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) {} dpSet(dpFrom(e)); });
  dpad.addEventListener('pointermove', e => { if (e.pointerId === dpId) dpSet(dpFrom(e)); });
  const dpEnd = (e) => { if (e.pointerId !== dpId) return; dpId = null; dpSet(null); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => dpad.addEventListener(ev, dpEnd));

  // スマホ向け：長押しメニュー・ダブルタップ拡大・ピンチを 無効化、裏に まわったら 自動セーブ
  ['contextmenu', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => { if (!(e.target && e.target.tagName === 'INPUT')) e.preventDefault(); }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { autoSave(); clearKeys(); dpSet(null); }
    else { keepAwake(); try { if (aCtx && aCtx.state !== 'running') aCtx.resume(); } catch (e) {} last = performance.now(); acc = 0; }
  });
  window.addEventListener('pagehide', autoSave);
  if (/google/.test(document.referrer || '')) document.documentElement.classList.add('gs');
  // ホーム画面用アイコン：同じ場所に 画像ファイルが 無いときは その場で 作る
  const mkIcon = () => {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    const g = x.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, '#1840a8'); g.addColorStop(0.6, '#78d8f8'); g.addColorStop(1, '#38b838');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180); x.fillStyle = '#f8e030'; x.beginPath(); x.arc(138, 46, 22, 0, Math.PI * 2); x.fill();
    x.drawImage(SPR.m_f_1, 26, 34, 128, 128); return c.toDataURL('image/png');
  };
  const useData = () => { try { const u = mkIcon(); $('lnk-touch').href = u; $('lnk-icon').href = u; } catch (e) {} };
  if (/^https?:$/.test(location.protocol) && $('lnk-touch')) { const im = new Image(); im.onerror = useData; im.src = 'apple-touch-icon.png'; } else if ($('lnk-touch')) useData();
  try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.self === window.top) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

  const KMAP = {w:'up', arrowup:'up', s:'down', arrowdown:'down', a:'left', arrowleft:'left', d:'right', arrowright:'right'};
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (e.target && e.target.tagName === 'INPUT') return;
    if (KMAP[k]) { e.preventDefault(); if (dirPress(KMAP[k])) return; KEYS[KMAP[k]] = true; return; }
    if (k === 'enter' || k === 'z' || k === 'j') { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); if (!e.repeat) handleA(); }
    if (k === ' ' || k === 'x' || k === 'k' || k === 'escape') { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); if (!e.repeat) handleB(); }
  });
  window.addEventListener('keyup', e => { const k = KMAP[e.key.toLowerCase()]; if (k) KEYS[k] = false; });
  window.addEventListener('blur', clearKeys);

  openTitle(); updMoney();
  requestAnimationFrame(frame);
}
init();
