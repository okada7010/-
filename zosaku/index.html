<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>造作3DCAD</title>
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --ink: #1d2733; --sub: #5f6c7b; --line: #d5dbe3;
  --accent: #1f6fd6; --accent-ink: #ffffff; --accent-soft: #e4eefb; --field: #f7f9fb;
  --warn: #b54708; --danger: #c92a2a; --stage: #eef1f5; --grid1: #b8c0cb; --grid2: #dde2e8;
  --shadow: 0 6px 24px rgba(20, 30, 45, .18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181e; --panel: #1c222b; --ink: #e5eaf0; --sub: #9aa6b4; --line: #323c49;
    --accent: #5aa5f7; --accent-ink: #0c1117; --accent-soft: #1f3350; --field: #161b22;
    --warn: #f5a524; --danger: #ff8787; --stage: #20262e; --grid1: #4a5564; --grid2: #2f3742;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", system-ui, sans-serif; font-size: 13px; line-height: 1.5;
  display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
  cursor: pointer; white-space: nowrap; min-height: 28px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--danger); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=number], input[type=text], select, textarea {
  background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; min-height: 26px;
  user-select: text; -webkit-user-select: text;
}
input[type=number] { width: 78px; text-align: right; font-variant-numeric: tabular-nums; }

/* 上部バー */
#top { background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.row { display: flex; align-items: center; gap: 6px 14px; padding: 5px 10px; flex-wrap: wrap; }
.row + .row { border-top: 1px solid var(--line); }
.brand { font-size: 15px; font-weight: 700; letter-spacing: .02em; display: flex; align-items: baseline; gap: 6px; }
.brand small { font-weight: 500; color: var(--sub); font-size: 11px; }
.grp { display: flex; align-items: center; gap: 4px; }
.grp > span.cap { color: var(--sub); font-size: 11px; margin-right: 2px; }
#docName { width: 170px; }
.spacer { flex: 1; }
#ctx { background: var(--accent-soft); height: 36px; font-size: 12.5px; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
#ctx label { display: inline-flex; align-items: center; gap: 4px; flex: none; }
#ctx input[type=number] { width: 64px; }
#ctx select { max-width: 210px; }
#ctx .tip { color: var(--sub); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#ctx b { font-weight: 700; }

/* 本体 */
main { flex: 1; display: flex; min-height: 0; }
aside { background: var(--panel); flex: none; overflow-y: auto; }
#lib { width: 232px; border-right: 1px solid var(--line); padding: 6px 8px 20px; }
#side { width: 292px; border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
#lib h3 {
  font-size: 12px; margin: 10px 0 4px; color: var(--sub); font-weight: 700; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
#lib h3::after { content: "－"; font-weight: 400; }
#lib section.closed h3::after { content: "＋"; }
#lib section.closed .items { display: none; }
.items { display: grid; gap: 3px; }
.item { text-align: left; white-space: normal; padding: 5px 8px; line-height: 1.3; }
.item small { display: block; color: var(--sub); font-size: 11px; }
.item.on small { color: inherit; opacity: .85; }
#stage { flex: 1; position: relative; min-width: 0; background: var(--stage); }
#view { position: absolute; inset: 0; }
#view canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; padding: 0 5px; border-radius: 4px; font-size: 12px; font-weight: 600;
  background: rgba(255, 255, 255, .92); color: #1d2733; border: 1px solid #c3cad3; white-space: nowrap;
  font-variant-numeric: tabular-nums; will-change: transform;
}
.lbl.dim { color: #b02a1c; border-color: #e0a79f; pointer-events: auto; cursor: pointer; }
.lbl.dim.sel { background: #1f6fd6; color: #fff; border-color: #1f6fd6; }
.lbl.live { background: #1f6fd6; color: #fff; border-color: #1f6fd6; }
.lbl.size { color: #1f4f96; border-color: #a9c4ea; }
#viewInfo {
  position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--sub); pointer-events: none;
  background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 2px 8px; border-radius: 5px;
}
#clipBox {
  position: absolute; right: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; display: none; align-items: center; gap: 8px; box-shadow: var(--shadow);
}
#clipBox.show { display: flex; }

/* 右パネル */
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; border-radius: 0; border-bottom: 2px solid transparent; background: none; min-height: 34px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); background: none; font-weight: 700; }
.pane { flex: 1; overflow-y: auto; padding: 10px 12px 24px; display: none; }
.pane.on { display: block; }
.pane h4 { margin: 14px 0 6px; font-size: 12px; color: var(--sub); }
.pane h4:first-child { margin-top: 0; }
.f { display: grid; grid-template-columns: 78px 1fr; gap: 5px 8px; align-items: center; }
.f label { color: var(--sub); font-size: 12px; }
.f .wide { grid-column: 1 / -1; }
.f input[type=text], .f select, .f textarea { width: 100%; }
.f .u { display: flex; align-items: center; gap: 4px; }
.f .u span { color: var(--sub); font-size: 11px; }
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tri label { display: flex; flex-direction: column; font-size: 11px; color: var(--sub); }
.tri input { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.empty { color: var(--sub); padding: 14px 4px; line-height: 1.8; }
.op { border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; margin-bottom: 6px; }
.op .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-weight: 600; }
.op .quad { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 8px; }
.op .quad label { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--sub); gap: 4px; }
.op .quad input { width: 70px; }
.kind { margin-bottom: 8px; }
.kind > header { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; padding: 3px 0; }
.kind > header span { color: var(--sub); font-weight: 400; }
.kind ul { list-style: none; margin: 0; padding: 0; }
.kind li {
  padding: 2px 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
  font-size: 12px;
}
.kind li:hover { background: var(--field); }
.kind li.sel { background: var(--accent-soft); }
.kind li span { color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 下部 */
#status {
  flex: none; display: flex; gap: 18px; padding: 3px 12px; border-top: 1px solid var(--line); background: var(--panel);
  font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
}
#status b { color: var(--ink); font-weight: 600; }

/* ダイアログ */
dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink);
  box-shadow: var(--shadow); max-width: min(960px, 94vw); max-height: 90vh;
}
dialog::backdrop { background: rgba(15, 20, 30, .45); }
dialog form { display: flex; flex-direction: column; max-height: 90vh; }
dialog header { padding: 12px 18px; font-size: 15px; font-weight: 700; border-bottom: 1px solid var(--line); }
dialog .body { padding: 14px 18px; overflow: auto; user-select: text; -webkit-user-select: text; }
dialog footer { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.form { display: grid; grid-template-columns: auto auto; gap: 8px 14px; align-items: center; justify-content: start; }
.form label { color: var(--sub); }
.form .note { grid-column: 1 / -1; color: var(--sub); font-size: 12px; max-width: 460px; }
table { border-collapse: collapse; width: 100%; margin: 4px 0 16px; font-size: 12.5px; }
th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: right; font-variant-numeric: tabular-nums; }
th { background: var(--field); font-weight: 600; text-align: center; white-space: nowrap; }
td:first-child, td.t { text-align: left; }
.cl-opt { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; color: var(--sub); }
.cl-opt label { display: inline-flex; align-items: center; gap: 5px; }
.help h5 { margin: 14px 0 4px; font-size: 13px; }
.help h5:first-child { margin-top: 0; }
.help ul { margin: 0; padding-left: 1.3em; }
.help kbd {
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--field);
  font-family: inherit; font-size: 12px;
}
#toast {
  position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); background: #1d2733; color: #fff;
  padding: 8px 16px; border-radius: 8px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none;
  max-width: 80vw; z-index: 50;
}
#toast.show { opacity: 1; }
@media (max-width: 900px) {
  #lib { width: 170px; }
  #side { width: 220px; }
}

</style>
</head>
<body>
<div id="top">
  <div class="row">
    <div class="brand">造作3DCAD <small>Ver1.1</small></div>
    <div class="grp"><span class="cap">図面名</span><input type="text" id="docName" maxlength="60" aria-label="図面名"></div>
    <div class="grp"><span class="cap">ファイル</span>
      <button data-act="new">新規</button>
      <button data-act="open">開く</button>
      <button data-act="save" title="Ctrl+S">保存</button>
      <button data-act="sample">サンプル</button>
    </div>
    <div class="grp"><span class="cap">出力</span>
      <button data-act="cutlist" class="primary">部材表</button>
      <button data-act="png">画像</button>
      <button data-act="obj" title="他の3Dソフト向け（mm、Zが上）">OBJ</button>
    </div>
    <div class="grp"><span class="cap">位置合わせ</span>
      <select id="gridSel" title="移動・作図の刻み" aria-label="刻み">
        <option value="1">1mm</option><option value="5">5mm</option><option value="10" selected>10mm</option>
        <option value="50">50mm</option><option value="100">100mm</option><option value="455">455mm</option><option value="910">910mm</option>
      </select>
      <button data-act="osnap" id="btnOsnap" class="on" title="ほかの部材の面にぴったり付ける">吸着</button>
    </div>
    <div class="spacer"></div>
    <button data-act="help">使い方</button>
  </div>
  <div class="row">
    <div class="grp"><span class="cap">ツール</span>
      <button data-tool="select" title="V">選択・移動</button>
      <button data-tool="wall" title="W">壁を描く</button>
      <button data-tool="measure" title="M">寸法を測る</button>
    </div>
    <div class="grp"><span class="cap">編集</span>
      <button data-act="undo" title="Ctrl+Z">元に戻す</button>
      <button data-act="redo" title="Ctrl+Y">やり直し</button>
      <button data-act="dup" data-need="sel" title="Ctrl+D">複製</button>
      <button data-act="array" data-need="sel">配列</button>
      <button data-act="group" data-need="sel2" title="Ctrl+G">グループ</button>
      <button data-act="ungroup" data-need="grp" title="Ctrl+Shift+G">解除</button>
      <button data-act="del" data-need="any" class="danger" title="Delete">削除</button>
    </div>
    <div class="grp"><span class="cap">90°回転</span>
      <button data-act="rotz" data-need="sel" title="平面で90°回す（R）">平面</button>
      <button data-act="rotx" data-need="sel" title="X軸まわりに90°（起こす・倒す）">X軸</button>
      <button data-act="roty" data-need="sel" title="Y軸まわりに90°（起こす・倒す）">Y軸</button>
    </div>
    <div class="grp"><span class="cap">表示</span>
      <button data-view="iso" title="1">立体</button>
      <button data-view="top" title="2">平面</button>
      <button data-view="front" title="3">正面</button>
      <button data-view="right" title="4">側面</button>
      <button data-act="ortho" id="btnOrtho" title="透視投影と平行投影の切替">平行投影</button>
      <button data-act="fit" title="F">全体</button>
      <button data-act="clip" id="btnClip" title="指定の高さから上を隠す">断面</button>
    </div>
  </div>
  <div class="row" id="ctx"></div>
</div>
<main>
  <aside id="lib" aria-label="部材ライブラリ"></aside>
  <div id="stage">
    <div id="view"></div>
    <div id="labels"></div>
    <div id="viewInfo"></div>
    <div id="clipBox"><span>断面の高さ</span><input type="range" id="clipRange" min="0" max="3000" step="10" value="1500"><input type="number" id="clipNum" value="1500" step="10"><span>mm</span></div>
  </div>
  <aside id="side">
    <div class="tabs"><button data-tab="props" class="on">プロパティ</button><button data-tab="list">部材一覧</button></div>
    <div class="pane on" id="pane-props"></div>
    <div class="pane" id="pane-list"></div>
  </aside>
</main>
<div id="status"><span id="stPos"></span><span id="stSel"></span><span id="stAll"></span><span id="stMsg"></span></div>
<dialog id="dlg"><form method="dialog"><header id="dlgTitle"></header><div class="body" id="dlgBody"></div><footer id="dlgFoot"></footer></form></dialog>
<div id="toast" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
